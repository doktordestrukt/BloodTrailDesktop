; BloodTrail Desktop settings. Comments start with ';'.
[Desktop]
DisableHMD=1          ; 1 = switch the headset off at start, so the game renders to the desktop even if SteamVR runs
BlockGameKeys=1       ; 1 = turn off the pawn's own keyboard debug keys (W, Q, F, Space...). F7 toggles in game
EyeHeight=165         ; camera height above the floor, cm
CrouchDrop=60         ; how far the head goes down when crouching, cm
MouseSensitivity=2.5  ; degrees per unit of the engine mouse axis
SprintMultiplier=2.0
NoclipSpeed=700       ; cm/s, Shift doubles it
SelfTest=0            ; 1 = run the scripted feature test once the pawn exists (PASS/FAIL lines in UE4SS.log)
SelfTestEnd=hold      ; hold = after the test keep the glock in the right hand and wave both hands
StartMap=              ; e.g. /Game/Maps/Sandbox/Map_Sandbox = load that map once at start (no VR menu input needed)
PlayerClass=/Game/VRExpansion/Vive/WendigoVrChar.WendigoVrChar_C ; spawned when the game spawns no player (no headset)
FOV=90                ; normal field of view
AimFOV=55             ; field of view while aiming (mouse wheel changes it while aiming)
Hud=1                 ; 1 = black/red HUD (loadout bar, ammo, health, crosshair)
RigidGrip=1           ; 1 = weapons drawn as a viewmodel (game grip paused, physics off, placed every frame)
MeleePitch=50         ; degrees a melee weapon is tilted up
AimGunDistance=40     ; cm in front of the eye the weapon sits when aiming down sights
AimToggle=0           ; 1 = right mouse toggles aiming instead of holding
MeleeDamage=45        ; base damage of a melee swing
